<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Agendados</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="header-placeholder"></div>
  <div id="sidebar-placeholder"></div>
  <main class="scheduled-container">
    <section id="section-hoje" class="tasks-section">
      <h2>Hoje</h2>
      <ul id="tasks-hoje" class="tasks-list"></ul>
      <div class="task-count">0 tarefas</div>
    </section>
    <section id="section-semanal" class="tasks-section">
      <h2>Esta Semana</h2>
      <ul id="tasks-semanal" class="tasks-list"></ul>
      <div class="task-count">0 tarefas</div>
    </section>
    <section id="section-mes" class="tasks-section">
      <h2>Este Mês</h2>
      <ul id="tasks-mes" class="tasks-list"></ul>
      <div class="task-count">0 tarefas</div>
    </section>
    <section id="section-indefinido" class="tasks-section">
      <h2>Indefinido</h2>
      <ul id="tasks-indefinido" class="tasks-list"></ul>
      <div class="task-count">0 tarefas</div>
    </section>
  </main>
  <script src="scheduled.js"></script>
</body>

</html>
