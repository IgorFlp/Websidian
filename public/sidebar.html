<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>Arquivos</h3>
    <button class="sidebar-close" id="sidebar-close" aria-label="Fechar sidebar">&#10005;</button>
  </div>
  <div class="sidebar-toolbar" id="sidebar-toolbar" style="display: none;">
    <span class="selection-count" id="selection-count">0 selecionado(s)</span>
    <button class="btn toolbar-btn" id="btn-open-editor">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" width="24" height="24">
        <path d="M20 16V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2H8" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" />
        <path d="M8 16l4.5-.2L22 6.2 17.8 2 8.3 11.5 8 16z" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button class="btn toolbar-btn" id="btn-add-task-view">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" class="header-icons" viewBox="0 0 16 16"
        fill="#fff">
        <path fill-rule="evenodd"
          d="M2 2.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5V3a.5.5 0 0 0-.5-.5zM3 3H2v1h1z" />
        <path
          d="M5 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M5.5 7a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1zM5.5 11a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1z" />
        <path fill-rule="evenodd"
          d="M1.5 7a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H2a.5.5 0 0 1-.5-.5zm0 3.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H2a.5.5 0 0 1-.5-.5z" />
      </svg>
    </button>
    <button class="btn toolbar-btn" id="btn-clear-selection">Limpar</button>
  </div>
  <ul class="folder-tree" id="folder-tree" role="tree"></ul>
  <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-controls="sidebar"
    aria-label="Redimensionar sidebar"></div>
</div>
<div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
