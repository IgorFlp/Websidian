<!-- Current Active Session -->
<div class="session-card">
    <div class="session-card-header">
        <div class="flex items-center gap-2 overflow-hidden">
            <span class="ai-dot"></span>
            <span class="session-card-title">{Session ID} {Session Name}</span>
        </div>
        <span class="session-card-time">{Session Time}</span>
    </div>
    <p class="session-card-subtitle">{Session Subtitle}</p>
</div>

<!-- Session 2 -->
<div class="session-card">
    <div class="session-card-header">
        <div class="flex items-center gap-2 overflow-hidden">
            <span class="ai-dot" style="background: var(--outline-variant); box-shadow: none;"></span>
            <span class="session-card-title">{Session ID 2} {Session Name 2}</span>
        </div>
        <span class="session-card-time">{Session Time 2}</span>
    </div>
    <p class="session-card-subtitle">{Session Subtitle 2}</p>
</div>
