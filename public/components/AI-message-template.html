<!-- AGENT HERMES RESPONSE -->
<div class="ai-message">
    <div class="ai-message-header">
        <div class="ai-dot"></div>
        <span class="ai-label">{Agent Name}</span>
        <span>•</span>
        <span class="ai-time">{Response Time}s</span>
        <button class="ai-brain-btn reasoning-toggle" id="brainBtn" title="Toggle Reasoning">
            <span class="reasoning-toggle-icon" id="brainIcon">🧠</span>
        </button>
    </div>
    <div class="reasoning-content collapsed" id="reasoningContainer">
        <p>{Reasoning text}</p>
    </div>
    <div class="ai-output">
        <p>{Output text}</p>
        {CLI Output}
        <div class="tts-player">
            <div class="flex items-center gap-3">
                <button src="{tts_audio_path}" class="tts-play-btn" title="{TTS Button Title}"
                    data-tts-path="{TTS Audio Path}">
                    <span data-icon="play_arrow">▶</span>
                </button>
            </div>
            <div class="tts-waveform">
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
            </div>
        </div>
    </div>
</div>
