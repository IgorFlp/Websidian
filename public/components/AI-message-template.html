<!-- AGENT HERMES RESPONSE -->
<div class="ai-message">
    <div class="ai-message-header">
        <div class="ai-dot"></div>
        <span class="ai-label">{Agent Name}</span>
        <span>•</span>
        <span class="ai-time">{Response Time}s</span>
        <button class="ai-brain-btn reasoning-toggle" id="brainBtn" title="Toggle Reasoning">
            <span class="reasoning-toggle-icon" id="brainIcon">🧠</span>
        </button>
    </div>
    <div class="reasoning-content collapsed" id="reasoningContainer">
        <p>{Reasoning text}</p>
    </div>
    <div class="ai-output">
        <p>{Output text}</p>
        <div class="cli-output">
            <div class="cli-header">
                <span class="cli-cmd">{CLI Command}</span>
                <span class="cli-status">{Exit Status}</span>
            </div>
            <div class="cli-body">
                <p>{CLI Line 1}</p>
                <p><span class="text-secondary">{Stream Label}</span> {Stream Message}</p>
                <p><span class="text-primary">{Bench Label}</span> {Bench Value}</p>
                <p><span class="text-tertiary">{Buffer Label}</span> {Buffer Message}</p>
                <p class="font-semibold">&gt;&gt; {Pipeline Status}</p>
            </div>
        </div>
        <div class="tts-player">
            <div class="flex items-center gap-3">
                <button src="{tts_audio_path}" class="tts-play-btn" title="{TTS Button Title}"
                    data-tts-path="{TTS Audio Path}">
                    <span data-icon="play_arrow">▶</span>
                </button>
            </div>
            <div class="tts-waveform">
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
                <span class="tts-wave-bar"></span>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('brainBtn').addEventListener('click', function () {
        var rc = document.getElementById('reasoningContainer');
        var icon = document.getElementById('brainIcon');
        rc.classList.toggle('collapsed');
        rc.classList.toggle('expanded');
        icon.classList.toggle('expanded');
    });
</script>
